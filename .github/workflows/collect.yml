name: JRA成績データ収集

on:
  workflow_dispatch:
    inputs:
      years:
        description: "対象年（例: 2021-2026 / 2024,2025）"
        default: "2021-2026"
      tracks:
        description: "競馬場（カンマ区切り）"
        default: "nakayama,hanshin"
  schedule:
    - cron: "0 20 * * 0"   # 毎週月曜 5:00 JST に自動更新

permissions:
  contents: write

concurrency:
  group: jra-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: pip install --quiet requests pdfplumber

      - name: 収集スクリプトを書き出す
        run: |
          cat > collect.py <<'PYEOF'
          import csv, os, re, time
          from pathlib import Path

          import requests
          import pdfplumber

          BASE = "https://www.jra.go.jp"
          IDX = BASE + "/datafile/seiseki/report/{y}.html"

          def parse_years(spec):
              spec = (spec or "").strip() or "2021-2026"
              if "-" in spec:
                  a, b = spec.split("-", 1)
                  return list(range(int(a), int(b) + 1))
              return [int(x) for x in spec.split(",") if x.strip()]

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (personal-research)"})

          def get(url, tries=4):
              for i in range(tries):
                  try:
                      r = s.get(url, timeout=90)
                      if r.status_code == 200:
                          return r
                      if r.status_code == 404:
                          return None
                      print("  HTTP", r.status_code, url, flush=True)
                  except Exception as e:
                      print("  retry", repr(e), flush=True)
                  time.sleep(2 * (i + 1))
              return None

          YEARS = parse_years(os.environ.get("YEARS"))
          TRACKS = [t.strip().lower() for t in
                    (os.environ.get("TRACKS") or "nakayama,hanshin").split(",") if t.strip()]

          root = Path("data")
          (root / "text").mkdir(parents=True, exist_ok=True)
          rows, new = [], 0

          for y in YEARS:
              r = get(IDX.format(y=y))
              if r is None:
                  print(f"[{y}] インデックス取得失敗", flush=True)
                  continue
              r.encoding = r.apparent_encoding or "utf-8"
              seen, items = set(), []
              for h in re.findall(r'href="([^"]+?\.pdf)"', r.text, flags=re.I):
                  name = h.rsplit("/", 1)[-1]
                  if not any(t in name.lower() for t in TRACKS):
                      continue
                  url = h if h.startswith("http") else BASE + (h if h.startswith("/") else "/" + h)
                  if url in seen:
                      continue
                  seen.add(url)
                  items.append((name, url))
              items.sort()
              print(f"[{y}] 対象 {len(items)} 件", flush=True)

              for name, url in items:
                  txt = root / "text" / str(y) / (name[:-4] + ".txt")
                  if not txt.exists():
                      resp = get(url)
                      if resp is None:
                          print("  DL NG", name, flush=True)
                          continue
                      tmp = Path("/tmp") / name
                      tmp.write_bytes(resp.content)
                      try:
                          parts = []
                          with pdfplumber.open(str(tmp)) as pdf:
                              for i, p in enumerate(pdf.pages, 1):
                                  parts.append("===== PAGE %d =====" % i)
                                  parts.append(p.extract_text(x_tolerance=1.2, y_tolerance=2.0) or "")
                          txt.parent.mkdir(parents=True, exist_ok=True)
                          txt.write_text("\n".join(parts), encoding="utf-8")
                          new += 1
                          print("  OK", name, flush=True)
                      except Exception as e:
                          print("  PARSE NG", name, repr(e), flush=True)
                      finally:
                          try:
                              tmp.unlink()
                          except OSError:
                              pass
                      time.sleep(0.8)

                  m = re.match(r"(\d{4})-(\d+)([a-z]+)(\d+)\.pdf$", name, flags=re.I)
                  rows.append({
                      "file": name, "year": y,
                      "kai": m.group(2) if m else "",
                      "track": m.group(3).lower() if m else "",
                      "nichi": m.group(4) if m else "",
                      "url": url, "path": str(txt),
                      "ok": int(txt.exists()),
                      "bytes": txt.stat().st_size if txt.exists() else 0,
                  })

          rows.sort(key=lambda d: (d["year"], d["track"], int(d["kai"] or 0), int(d["nichi"] or 0)))
          with (root / "index.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=["file", "year", "kai", "track",
                                                "nichi", "url", "path", "ok", "bytes"])
              w.writeheader()
              w.writerows(rows)

          print("=" * 50, flush=True)
          print("対象 %d 件 / テキスト化済み %d 件 / 今回新規 %d 件"
                % (len(rows), sum(r["ok"] for r in rows), new), flush=True)
          PYEOF
          python -c "import ast,sys; ast.parse(open('collect.py',encoding='utf-8').read()); print('script syntax OK')"

      - name: 実行
        env:
          YEARS: ${{ inputs.years || '2021-2026' }}
          TRACKS: ${{ inputs.tracks || 'nakayama,hanshin' }}
        run: python collect.py

      - name: まとめて取り出せるようバンドル化
        run: |
          tar czf /tmp/bundle.tar.gz -C data text index.csv
          mv /tmp/bundle.tar.gz data/bundle.tar.gz
          ls -lh data/bundle.tar.gz

      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "JRA成績データ更新 $(date -u +%Y-%m-%d)"
            git push
          fi
